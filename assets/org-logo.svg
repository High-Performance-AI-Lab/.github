<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- High-Performance-AI-Lab organization logo — vector twin of
       assets/org-logo.png (see scripts/generate_org_logo.py). Keep in sync. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1024" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3fb9aa"/>
      <stop offset="1" stop-color="#62a0ff"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="#0d1117"/>
  <polygon points="512,142 832.2,326.9 832.2,717.1 512,902 191.8,717.1 191.8,326.9"
           fill="none" stroke="url(#ring)" stroke-width="72"
           stroke-linejoin="round"/>
  <text x="512" y="512" fill="#f0f6fc"
        font-family="SF Pro Display, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="500" font-weight="700" text-anchor="middle" dominant-baseline="central">H</text>
</svg>
